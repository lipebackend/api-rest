services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - task-network
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-network
  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"     # Porta do protocolo AMQP (para a aplicação Java)
      - "15672:15672"   # Painel Web do RabbitMQ (user: guest / pass: guest)
    networks:
      - task-network

  api:
    image: task-management-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - task-network

volumes:
  redis_data:
  postgres_data:

networks:
  task-network:
    driver: bridge
